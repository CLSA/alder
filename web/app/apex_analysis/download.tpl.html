<div class="record-view rounded">
  <div class="container-fluid bg-primary rounded-top">
    <h4>
      Download re-analysis images and data from Apex for {{ model.parentModel.viewModel.record.uid }}
      <span ng-if="model.isLoading">(Loading&hellip;)</span>
    </h4>
  </div>
  <form name="form" class="form-horizontal" novalidate>
    <fieldset ng-disabled="model.isLoading || model.downloadingFiles">
      <div class="form-body" style="padding-bottom: 1em;">
        <div class="container-fluid">
          <label for="hostId" class="control-label">Apex Workstation</label>
          <div class="input-group">
            <div class="row">
              <div class="col-sm-12">
                <select
                  id="hostId"
                  ng-model="model.hostId"
                  ng-change="model.onHostChange()"
                  ng-options="item.value as item.name for item in model.hostList"
                  class="form-control"
                ></select>
              </div>
            </div>
          </div>
          <div class="vertical-spacer"></div>
          <div class="panel-group">
            <div class="panel panel-default">
              <div class="panel-heading">
                <h4>Download Re-analysis Data</h4>
              </div>
              <div class="panel-body">
                TODO: Create download of re-analysis data here.
              </div>
              <div class="panel-footer text-right">
                <button type="button" class="btn btn-primary" ng-click="model.deleteFiles()">
                  <span ng-if="model.deletingFiles">
                    Deleting Images...
                  </span>
                  <span ng-if="!model.deletingFiles">
                    <i class="glyphicon glyphicon-cloud-upload"></i>
                   Delete all Images
                  </span>
                </button>
                <button type="button" class="btn btn-primary" ng-click="model.downloadFiles()">
                  <span ng-if="model.downloadingFiles">
                    Downloading Data...
                  </span>
                  <span ng-if="!model.downloadingFiles">
                    <i class="glyphicon glyphicon-cloud-download"></i>
                    Download Data
                  </span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="form-footer text-right rounded-buttom bg-info">
        <div class="btn-group">
          <button type="button" class="btn btn-primary" ng-click="viewParent()">View Apex Review</button>
        </div>
      </div>
    </fieldset>
  </form>
</div>
