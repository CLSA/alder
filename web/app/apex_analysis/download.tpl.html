<div class="record-view rounded">
  <div class="container-fluid bg-primary rounded-top">
    <h4>
      Apex Workstation Reanalysis Download for {{ model.parentModel.viewModel.record.uid }}
      <span ng-if="model.isLoading">(Loading&hellip;)</span>
    </h4>
  </div>
  <form name="form" class="form-horizontal" novalidate>
    <fieldset ng-disabled="model.isLoading || model.downloadingImage || model.deletingImages">
      <div class="form-body" style="padding-bottom: 1em;">
        <div class="container-fluid">
          <label for="hostId" class="control-label">Apex Workstation</label>
          <div class="input-group">
            <div class="row">
              <div class="col-sm-12">
                <select
                  id="hostId"
                  ng-model="model.hostId"
                  ng-change="model.onHostChange()"
                  ng-options="item.value as item.name for item in model.parentModel.hostList"
                  class="form-control"
                ></select>
              </div>
            </div>
          </div>
          <hr />
          <div class="input-group">
            <div class="form-group first-form-group">
              <label for="hostId" class="control-label col-sm-3">Download Date</label>
              <div class="col-sm-9">
                <input
                  ng-model="model.parentModel.viewModel.formattedRecord.download_datetime"
                  class="form-control"
                  readonly
                ></input>
                <span
                  ng-if="null != model.downloadResult"
                  ng-class="model.downloadResult ? 'text-success' : 'text-danger'"
                >
                  {{
                    model.downloadResult ?
                    "Reanalysed image successfully downloaded" :
                    "Error while downloading reanalysed image"
                  }}
                  <i
                    class="glyphicon"
                    ng-class="model.downloadResult ? 'glyphicon-ok': 'glyphicon-remove'"
                  ></i>
                </span>
              </div>
            </div>
            <div class="text-right">
              <div class="btn-group">
                <button type="button" class="btn btn-primary" ng-click="model.deleteImages()">
                  <span ng-if="model.deletingImages">Deleting Images...</span>
                  <span ng-if="!model.deletingImages">Delete all Images</span>
                </button>
                <button type="button" class="btn btn-primary" ng-click="model.downloadImage()">
                  <span ng-if="model.downloadingImage">
                    Downloading Image{{ null == model.baseImage ? "" : "s" }}...
                  </span>
                  <span ng-if="!model.downloadingImage">
                    <i class="glyphicon glyphicon-cloud-download"></i>
                    Download Image{{ null == model.baseImage ? "" : "s" }}
                  </span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="form-footer text-right rounded-buttom bg-info">
        <div class="btn-group">
          <button type="button" class="btn btn-primary" ng-click="viewParent()">View Apex Review</button>
        </div>
      </div>
    </fieldset>
  </form>
</div>
